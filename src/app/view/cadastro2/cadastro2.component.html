<div class="move_card_PesquisaID">
    <div class="card" style="width: 18rem;">
        <h5 class="card-title">Pesquisar ID</h5>
        <br>
        <input type="text" [(ngModel)]="vId">
        <br>
        <button (click)="encontrarCadastro2()" id="consultarId">Consultar</button>
        <br>
    </div>
    <br>

    <div class="move_Return_Api">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="id-tab" data-bs-toggle="tab" data-bs-target="#id-tab-pane"
                    type="button" role="tab" aria-controls="id-tab-pane" aria-selected="true">Id</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="nome-tab" data-bs-toggle="tab" data-bs-target="#nome-tab-pane"
                    type="button" role="tab" aria-controls="nome-tab-pane" aria-selected="false">Nome</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="departamento-tab" data-bs-toggle="tab"
                    data-bs-target="#departamento-tab-pane" type="button" role="tab"
                    aria-controls="departamento-tab-pane" aria-selected="false">Departamento</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="endereco-tab" data-bs-toggle="tab" data-bs-target="#endereco-tab-pane"
                    type="button" role="tab" aria-controls="endereco-tab-pane" aria-selected="false">Endereço</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="email-tab" data-bs-toggle="tab" data-bs-target="#email-tab-pane"
                    type="button" role="tab" aria-controls="email-tab-pane" aria-selected="false">Email</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="id-tab-pane" role="tabpanel" aria-labelledby="id-tab"
                tabindex="1">
                {{vCadastro.id}}
            </div>
            <div class="tab-pane fade" id="nome-tab-pane" role="tabpanel" aria-labelledby="nome-tab" tabindex="2">
                {{vCadastro.nome}}
            </div>
            <div class="tab-pane fade" id="departamento-tab-pane" role="tabpanel" aria-labelledby="departamento-tab"
                tabindex="3">
                {{vCadastro.departamento}}
            </div>
            <div class="tab-pane fade" id="endereco-tab-pane" role="tabpanel" aria-labelledby="endereco-tab"
                tabindex="4">
                {{vCadastro.endereco}}
            </div>
            <div class="tab-pane fade" id="email-tab-pane" role="tabpanel" aria-labelledby="email-tab" tabindex="5">
                <div>{{vCadastro.email}}</div>
            </div>
        </div>
    </div>
    <br>
    <button id="excluir" (click)="apagaCadastro()">Exclusão</button>
    <br>
    <button id="inserir" (click)="inserirCadastro()">Inserir</button>
</div>
